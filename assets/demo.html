function compare(publicSet){const winner=publicSet?25:21;return `<div class="compare-sub">${publicSet?'Full public validation set':'Same hidden test set'} · 100 queries · Accuracy@5</div><div class="comparison"><div class="comparison-row"><div class="comparison-label">BM25 candidate order</div><div class="comparison-track"><div class="comparison-fill" style="width:50%"></div></div><div class="comparison-value muted">15%</div></div><div class="comparison-row"><div class="comparison-label">${publicSet?'Unigram + bigram<br>window scoring':'Submitted hybrid'}</div><div class="comparison-track"><div class="comparison-fill blue" style="width:${winner/30*100}%"></div></div><div class="comparison-value blue">${winner}%</div></div><div class="comparison-axis"><span>0%</span><span>30%</span></div></div><div class="gain-line"><span class="gain-badge">+${winner-15} percentage points</span>${publicSet?'':'<span>15 → 21 successful queries</span>'}</div><div class="comparison-note">${publicSet?'Strongest completed lexical experiment · not the final hybrid.<br>192-word windows, stride 192.':'Improvement over BM25 candidate order.<br>No same-set score was measured for the Cross-Encoder starter.'}</div>`}
function view(id){switch(id){

case'validation':return compare(true);
case'solution':return `<div class="solution-steps"><div class="solution-step"><b>160-word windows</b><p>80-word stride<br>Clean the text</p></div><div class="arrow">→</div><div class="solution-step"><b>Lexical selection</b><p>Unigram + bigram<br>window signals</p></div><div class="arrow">→</div><div class="solution-step"><b>Fixed BGE scoring</b><p>Score promising<br>candidate windows</p></div><div class="arrow">→</div><div class="solution-step"><b>Aggregate & rank</b><p>Max BGE score<br>+ lexical prior</p></div></div><div class="solution-basis">Choice informed by lexical validation, BGE experiments and CPU timing.</div>${box('/app/src/server.py · exact excerpts',`<div class="code-line"><span class="ln">338</span>scores = self.cross_encoder.score(text, passages)</div><div class="code-line"><span class="ln">362</span>final.append((ce + 0.35 * lex, order, doc_id))</div>`,'solution-code')}`;

case'task':return `<div class="frozen-flow"><div class="frozen-block"><div class="large">100</div><div class="label">Fixed BM25 candidates</div></div><div class="arrow">→</div><div class="frozen-block model"><strong>BAAI/<br>bge-reranker-large</strong><p>Fixed local model</p></div><div class="arrow">→</div><div class="frozen-block"><div class="large blue">5</div><div class="label">Reranked results</div></div></div><div class="fixed-rules">No extra candidates · no model replacement or training</div>`;

case'launch':return `<div class="run-label">Pi <span class="muted">+</span> DeepSeek Flash</div>${box('Actual evaluation command',`bash scripts/run_task.sh --task task-2-1 --agent pi \\\n  --thinking xhigh --output jobs/task-2-1-pi-deepseek`)}`;
case'timeout':return `<div class="timeout"><div style="text-align:center"><div class="large">600<span class="unit">s</span></div><div class="label muted" style="margin-top:30px">Tool timeout</div></div><div>${box('Recorded benchmark output',evidence.timeout.lines.map((x,i)=>`<div class="code-line ${i?'bad':''}">${esc(x)}</div>`).join(''))}</div></div>`;

case'windows':return pipeline(false);case'rank':return pipeline(true);

case'verify':return `<div class="verify-flow"><div class="verify-node"><h2>Build</h2><div class="icon">&gt;_</div></div><div class="arrow">→</div><div class="verify-node"><h2>Run twice</h2><div class="runs"><span>A</span><span>B</span></div></div><div class="arrow">→</div><div class="verify-node"><h2>Compare & score</h2><div class="icon">A = B</div></div></div><div class="verify-note">Held-out queries · deterministic output · valid JSONL</div>`;

if(s.id==='diff')q('.plus').style.opacity=Math.max(.1,Math.min(1,(dt-1.4)/.45));
if(s.id==='entrypoints')qa('.artifact').forEach((e,i)=>e.style.borderColor=i===(dt<3?0:1)?'#315cad':'#d7e0ed');
if(s.id==='contract')q('.contract-layout>div:last-child').style.opacity=Math.max(.06,Math.min(1,(dt-1.8)/.5));
if(s.id==='verify')qa('.verify-node').forEach((e,i)=>{const active=Math.min(2,Math.floor(dt/1.7));e.style.borderColor=i===active?'#315cad':'#d5dfed';e.style.opacity=i<=active?1:.4;});
if(s.id==='solution')qa('.solution-step').forEach((e,i)=>{const active=Math.min(3,Math.floor(dt/2.2));e.style.borderColor=i===active?'#315cad':'#d1dced';e.style.background=i===active?'#edf3fd':'#f7f9fd';});
}
let activeKey=-1,current,previous;window.setDemoTime=t=>{t=Math.max(0,Math.min(123.999,t));const index=scenes.findIndex(s=>t>=s.start&&t<s.end),s=scenes[index],dt=t-s.start;
if(index!==activeKey){const container=$('#scene-layers');container.innerHTML='';previous=null;if(index>0){previous=makeLayer(scenes[index-1]);container.append(previous);animateLayer(previous,scenes[index-1],scenes[index-1].end-scenes[index-1].start-.001);}current=makeLayer(s);container.append(current);activeKey=index;document.querySelectorAll('.phases span').forEach(e=>e.classList.toggle('active',e.textContent===s.phase));}
animateLayer(current,s,dt);const ease=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)};const incoming=index===0?ease((dt+.1)/.4):ease((dt-.32)/.28);const outgoing=index===0?0:1-ease(dt/.28);current.style.opacity=incoming;if(previous){previous.style.opacity=outgoing;previous.style.visibility=outgoing<=0?'hidden':'visible';}
const previousChapter=index>0&&!!scenes[index-1].chapter;$('header').style.opacity=s.chapter?(previousChapter?0:outgoing):(previousChapter?incoming:1);if(index===0)$('header').style.opacity=0;
$('#progress').style.opacity=s.chapter?0:1;$('#progress').style.width=t/124*1920+'px';$('#seek').value=t;$('#clock').textContent=`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')} / 2:04`;};
function fit(){const scale=Math.min(innerWidth/1920,innerHeight/1080);$('#stage').style.transform=`scale(${scale})`;$('#stage').style.left=(innerWidth-1920*scale)/2+'px';$('#stage').style.top=(innerHeight-1080*scale)/2+'px'}fit();addEventListener('resize',fit);
const capture=new URLSearchParams(location.search).has('capture');if(capture)document.body.classList.add('capture');$('#seek').max=124;let playing=!capture,t=0,last=performance.now();$('#play').onclick=()=>{if(t>=123.99)t=0;playing=!playing;$('#play').textContent=playing?'Pause':'Play';last=performance.now()};$('#seek').oninput=e=>{t=+e.target.value;setDemoTime(t)};function tick(now){if(playing){t+=(now-last)/1000;if(t>=124){t=123.999;playing=false;$('#play').textContent='Replay'}setDemoTime(t)}last=now;requestAnimationFrame(tick)}demoReady.then(()=>{setDemoTime(0);if(!capture)requestAnimationFrame(tick)});
</script></body></html>
