function makeLayer(s){const e=document.createElement('section');e.className='scene-layer'+(s.agentStep!==undefined?' agent-layer':'')+(s.verifyStep!==undefined?' verify-layer':'');if(s.chapter){e.innerHTML=`<div class="chapter-card"><span class="chapter-num">${s.chapter}</span><span class="chapter-rule"></span><span class="chapter-title">${s.title}</span></div>`;}else{e.innerHTML=`<h1>${s.title}</h1><main class="scene-body">${view(s.id)}</main>`;}return e;}
function animateLayer(el,s,dt){const q=x=>el.querySelector(x),qa=x=>el.querySelectorAll(x);if(s.chapter)return;

if(s.id==='contract')q('.contract-layout>div:last-child').style.opacity=Math.max(.06,Math.min(1,(dt-1.8)/.5));
if(s.id==='verify')qa('.verify-node').forEach((e,i)=>{const active=Math.min(2,Math.floor(Math.max(0,dt-.5)/1.65));e.style.borderColor=i===active?'#315cad':'#d5dfed';e.style.background=i===active?'#edf3fc':'#f9fbfe';e.style.opacity=i<=active?1:.35;});

if(s.id==='solution')qa('.solution-step').forEach((e,i)=>{const active=Math.min(3,Math.floor(dt/2.2));e.style.borderColor=i===active?'#315cad':'#d1dced';e.style.background=i===active?'#edf3fd':'#f7f9fd';});
}
let activeKey=-1,current,previous;window.setDemoTime=t=>{t=Math.max(0,Math.min(161.499,t));const index=scenes.findIndex(s=>t>=s.start&&t<s.end),s=scenes[index],dt=t-s.start;
if(index!==activeKey){const container=$('#scene-layers');container.innerHTML='';previous=null;if(index>0){previous=makeLayer(scenes[index-1]);container.append(previous);animateLayer(previous,scenes[index-1],scenes[index-1].end-scenes[index-1].start-.001);}current=makeLayer(s);container.append(current);activeKey=index;document.querySelectorAll('.phases span').forEach(e=>e.classList.toggle('active',e.textContent===s.phase));}

const previousChapter=index>0&&!!scenes[index-1].chapter;$('header').style.opacity=s.chapter?(previousChapter?0:outgoing):(previousChapter?incoming:1);if(index===0)$('header').style.opacity=0;
